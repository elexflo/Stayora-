<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Hotels - Stayora</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1 class="logo"><a href="index.html" style="text-decoration: none; color: inherit;">Stayora</a></h1>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="hotels.html">Search Hotels</a></li>
                <li><a href="list-property.html">List Property</a></li>
                <li id="authNav">
                    <a href="login.html">Login</a>
                </li>
                <li id="userNav" style="display: none;">
                    <a href="#" id="userEmail"></a>
                    <button id="logoutBtn" class="btn-logout">Logout</button>
                </li>
                <li id="adminNav" style="display: none;">
                    <a href="admin/index.html" class="btn-admin">Admin Dashboard</a>
                </li>
            </ul>
        </div>
    </nav>

    <!-- Search Filters -->
    <section class="search-section">
        <div class="container">
            <h2>Search Hotels</h2>
            <div class="search-container">
                <form id="filterForm" class="search-form">
                    <div class="search-field">
                        <label for="destination">Destination</label>
                        <input type="text" id="destination" placeholder="City or hotel name">
                    </div>
                    <div class="search-field">
                        <label for="checkIn">Check-in</label>
                        <input type="date" id="checkIn">
                    </div>
                    <div class="search-field">
                        <label for="checkOut">Check-out</label>
                        <input type="date" id="checkOut">
                    </div>
                    <div class="search-field">
                        <label for="priceRange">Max Price</label>
                        <input type="number" id="priceRange" placeholder="e.g., 500" min="0">
                    </div>
                    <button type="submit" class="btn-primary">Filter</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Hotels Results -->
    <section class="hotels-section">
        <div class="container">
            <div id="loadingSpinner" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Loading hotels...</p>
            </div>
            <div id="hotelsResults" class="hotels-grid">
                <!-- Hotels will be loaded here -->
            </div>
            <div id="noResults" style="display: none; text-align: center; padding: 40px;">
                <h3>No hotels found</h3>
                <p>Try adjusting your search criteria</p>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 Stayora. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
    <script src="js/hotels.js"></script>
</body>
</html>
